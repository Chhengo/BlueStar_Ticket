spring:
  application:
    name: BlueStar_Ticket
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ticket?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
jwt:
  # 密钥：请使用一个至少 32 字符的复杂随机串（生产环境建议从环境变量读取）
  secret: 1234567890abcdefghijklmnopqrstuvwxyzABCDEFG
  # 过期时间：24小时 (单位毫秒)
  expiration: 86400000
mybatis:
  configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 控制台打印SQL执行日志
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ticket.entity