spring:
  kafka:
    bootstrap-servers: 192.168.227.142:9092   # ← 换成你的虚拟机 IP
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: BlueStar_Ticket-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.ticket.*"
  # 自定义 Kafka topic 名
  ticket:
    kafka:
      topic:
        order-create: ticket.order.create

  data:
    redis:
      host: 192.168.227.142     # ← 换成你的虚拟机 IP
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10
          min-idle: 2
    # Kafka 配置



  application:
    name: BlueStar_Ticket
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ticket?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
jwt:
  # 密钥：请使用一个至少 32 字符的复杂随机串（生产环境建议从环境变量读取）
  secret: 1234567890abcdefghijklmnopqrstuvwxyzABCDEFG
  # 过期时间：24小时 (单位毫秒)
  expiration: 86400000
mybatis:
  configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 控制台打印SQL执行日志
      map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ticket.entity

